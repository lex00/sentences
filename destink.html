<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sentences · de-stink</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; min-height: 100%; }
      body { display: grid; place-items: start center; background: #f7f6f2; font-family: ui-sans-serif, system-ui, sans-serif; color: #2b2b2b; }
      main { width: min(880px, 94vw); padding: 1.2rem 0 3rem; }
      h1 { font-size: 1.3rem; font-weight: 600; margin: .2rem 0; text-align: center; }
      .sub { color: #8a8473; font-size: .85rem; margin: 0 0 1rem; text-align: center; }
      .sub a { color: #8a8473; }
      textarea#input {
        width: 100%; box-sizing: border-box; min-height: 8rem; padding: .7rem .8rem; border: 1px solid #d8d2c4;
        border-radius: 6px; font: 15px ui-serif, Georgia, serif; background: #fffdf8; color: #2b2b2b; resize: vertical;
      }
      .row { display: flex; gap: .5rem; align-items: center; margin: .6rem 0; flex-wrap: wrap; }
      button { padding: .5rem .85rem; border: 1px solid #d8d2c4; border-radius: 6px; background: #fffdf8; color: #2b2b2b; font: 14px ui-sans-serif, system-ui; cursor: pointer; }
      button:hover { border-color: #b4451f; }
      button:disabled { opacity: .5; cursor: default; }
      button:disabled:hover { border-color: #d8d2c4; }
      button.primary { background: #b4451f; border-color: #b4451f; color: #fffdf8; }
      #status { color: #8a8473; font-size: .82rem; min-height: 1.1rem; margin: 0 0 .6rem; }

      .card { background: #fffdf8; border: 1px solid #e2ddd0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: .9rem 1rem; margin-bottom: .9rem; }
      .card h2 { font-size: .95rem; margin: 0 0 .6rem; color: #6a6a6a; text-transform: uppercase; letter-spacing: .03em; }

      /* score */
      #score .total { font-size: 1.6rem; font-weight: 700; color: #b4451f; }
      #score .total .unit { font-size: .7rem; font-weight: 400; color: #8a8473; margin-left: .4rem; text-transform: none; letter-spacing: 0; }
      #score .tiers { display: flex; gap: 1.2rem; margin-top: .5rem; flex-wrap: wrap; }
      #score .tier-row { font-size: .82rem; color: #6a6a6a; }
      #score .tier-row .tier-name { color: #8a8473; margin-right: .3rem; }
      #score .tier-val { font-weight: 600; }
      #score .meta { margin-top: .5rem; font-size: .78rem; color: #8a8473; }

      /* toggles */
      details#togglesWrap summary { cursor: pointer; font-size: .95rem; color: #6a6a6a; padding: .2rem 0; }
      .toggle-group { margin: .5rem 0 .8rem; }
      .toggle-heading { font-size: .78rem; color: #8a8473; text-transform: uppercase; letter-spacing: .03em; margin-bottom: .25rem; }
      .toggle-row { display: block; font-size: .85rem; padding: .12rem 0; }
      .toggle-row input { margin-right: .4rem; }

      /* annotated text */
      #annotated { white-space: pre-wrap; word-wrap: break-word; font: 15px ui-serif, Georgia, serif; line-height: 1.6; }
      #annotated .empty { color: #8a8473; font-family: ui-sans-serif, system-ui; font-style: italic; }
      #annotated mark { border-radius: 2px; padding: 0 1px; cursor: pointer; background: transparent; color: inherit; }
      #annotated mark.sev-candidate { border-bottom: 2px dashed #c9a98a; }
      #annotated mark.sev-low { background: rgba(180, 69, 31, .10); border-bottom: 2px solid rgba(180, 69, 31, .35); }
      #annotated mark.sev-medium { background: rgba(180, 69, 31, .18); border-bottom: 2px solid rgba(180, 69, 31, .55); }
      #annotated mark.sev-high { background: rgba(180, 69, 31, .30); border-bottom: 2px solid #b4451f; }
      #annotated mark.stacked { box-shadow: 0 3px 0 0 #b4451f; }
      #annotated mark.flash { background: #ffe08a; }

      /* findings */
      .tier-section h3 { font-size: .82rem; color: #8a8473; text-transform: uppercase; letter-spacing: .03em; margin: .8rem 0 .3rem; }
      .tier-section:first-child h3 { margin-top: 0; }
      .finding { border-top: 1px solid #eee7d8; padding: .5rem 0; cursor: pointer; }
      .finding:hover { background: #fbf5e8; }
      .finding-head { display: flex; gap: .5rem; align-items: baseline; }
      .finding-msg { font-size: .92rem; font-weight: 600; }
      .finding-explain { font-size: .84rem; color: #6a6a6a; margin-top: .15rem; }
      .badge { font-size: .68rem; text-transform: uppercase; letter-spacing: .03em; padding: .1rem .4rem; border-radius: 4px; color: #fffdf8; flex: none; }
      .badge.sev-candidate { background: #c9a98a; }
      .badge.sev-low { background: #b98a5e; }
      .badge.sev-medium { background: #b4682f; }
      .badge.sev-high { background: #b4451f; }
      .diagram-mount { margin-top: .3rem; } /* TODO(#26): "show me" diagram affordance mounts here */
      .empty { color: #8a8473; font-style: italic; font-size: .88rem; }

      /* fix diff */
      .fix-summary { font-size: .85rem; color: #6a6a6a; margin: 0 0 .6rem; }
      .fix-cols { display: flex; gap: .8rem; flex-wrap: wrap; }
      .fix-col { flex: 1 1 260px; min-width: 0; }
      .fix-col-label { font-size: .72rem; color: #8a8473; text-transform: uppercase; letter-spacing: .03em; margin-bottom: .25rem; }
      .fix-text { white-space: pre-wrap; word-wrap: break-word; font: 13px ui-monospace, monospace; background: #fbf8f0; border: 1px solid #eee7d8; border-radius: 6px; padding: .6rem; margin: 0; max-height: 16rem; overflow: auto; }
      .fix-text del { background: rgba(180, 69, 31, .18); text-decoration: line-through; color: #8a4322; }
      .fix-text ins { background: rgba(46, 125, 50, .18); text-decoration: none; color: #2e7d32; }

      a.home { color: #8a8473; font-size: .8rem; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>De-stink</h1>
      <p class="sub">Paste prose, find the AI writing tells. &nbsp;·&nbsp; <a class="home" href="index.html">← the diagram tool</a></p>

      <textarea id="input" placeholder="Paste or write a paragraph…"></textarea>
      <div class="row">
        <button id="lintBtn" class="primary">Lint</button>
        <button id="fixBtn">Apply mechanical fixes</button>
      </div>
      <p id="status"></p>

      <div class="card">
        <h2>Stink score</h2>
        <div id="score"></div>
      </div>

      <details id="togglesWrap" class="card">
        <summary>Rule toggles</summary>
        <div id="toggles"></div>
      </details>

      <div id="fixPanel" class="card" hidden>
        <h2>Apply mechanical fixes</h2>
        <div id="fixDiff"></div>
        <div class="row">
          <button id="acceptFix" class="primary">Accept — replace my text</button>
          <button id="discardFix">Discard</button>
        </div>
      </div>

      <div class="card">
        <h2>Annotated text</h2>
        <div id="annotated"></div>
      </div>

      <div class="card">
        <h2>Findings</h2>
        <div id="findings"></div>
      </div>
    </main>
    <script type="module" src="/src/destink/main.ts"></script>
  </body>
</html>
